steps:
  - name: build-archieve
    when:
      event: [tag, push]
    image: debian:trixie
    commands:
      - apt update && apt install -y --no-install-recommends build-essential libusb-1.0-0-dev
      - make
      - mkdir -p /builds/argb-colors
      - cp bin/argb-colors /builds/argb-colors/
    volumes:
      - /home/www/builds:/builds
